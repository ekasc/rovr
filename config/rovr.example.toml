[general]
layout = "bsp"
gap = 10
padding = 8
reconcile_on_wake = true
reconcile_interval_ms = 1000

[focus]
follows_mouse = false

[animations]
enabled = true
duration_ms = 160
curve = "ease_out_quint"

[[workspace]]
name = "code"
layout = "bsp"
display = "main"
persistent = true

[[workspace]]
name = "chat"
layout = "stack"
display = "2"
persistent = true

[[rule]]
app = "^Finder$"
float = true

[[rule]]
app = "^Slack$"
workspace = "chat"

# Optional keybinds. These are the single source of truth for skhd and for a
# future built-in hotkey listener. key uses skhd syntax, command is the rovr
# CLI invocation without the leading "rovr".
