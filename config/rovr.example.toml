config-version = 1

[general]
layout = "bsp"
gap = 10
padding = 8
reconcile_on_wake = true
reconcile_interval_ms = 1000
# Window shadows. Set to false to remove shadows from every managed window
# (scripting-addition `set_window_shadow`).
window_shadow = true

# Screen padding: reserves space along the edges of each display before ROVR
# calculates tiled window layouts. Useful for status bars such as SketchyBar
# or for custom desktop spacing. This is distinct from `gap` (spacing between
# tiled windows) and from `general.padding` (uniform inner inset). Applies
# independently to every display. All values are pixels, all default to 0.
[layout.padding]
top = 28
right = 0
bottom = 0
left = 0

[focus]
follows_mouse = false

[animations]
enabled = true
duration_ms = 160
curve = "ease_out_quint"

[[workspace]]
name = "code"
layout = "bsp"
display = "main"
persistent = true

[[workspace]]
name = "chat"
layout = "stack"
display = "2"
persistent = true

[[rule]]
app = "^Finder$"
float = true

[[rule]]
app = "^Slack$"
workspace = "chat"

# Ignore a window entirely: with `manage = false` the matching window is not
# tiled, not moved to a workspace, and receives no opacity/layer action. It is
# still observed (visible in `rovr query windows`). Matches on `app` (bundle id
# or app name) and/or `title`, both regex.
# [[rule]]
# app = "^System Settings$"
# manage = false

# Global hotkeys are owned by skhd, not by rovr. Define them in
# ~/.config/skhd/skhdrc as `key : rovr <command>`, e.g.
#   alt - h : rovr window focus-direction west
#   shift + alt - r : rovr config reload
# rovr has no [[bind]] table and registers no hotkeys of its own.
