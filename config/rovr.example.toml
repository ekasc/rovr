config-version = 1

[general]
layout = "bsp"
gap = 10
padding = 8
reconcile_on_wake = true
reconcile_interval_ms = 1000

# Screen padding: reserves space along the edges of each display before ROVR
# calculates tiled window layouts. Useful for status bars such as SketchyBar
# or for custom desktop spacing. This is distinct from `gap` (spacing between
# tiled windows) and from `general.padding` (uniform inner inset). Applies
# independently to every display. All values are pixels, all default to 0.
[layout.padding]
top = 28
right = 0
bottom = 0
left = 0

[focus]
follows_mouse = false

[animations]
enabled = true
duration_ms = 160
curve = "ease_out_quint"

[[workspace]]
name = "code"
layout = "bsp"
display = "main"
persistent = true

[[workspace]]
name = "chat"
layout = "stack"
display = "2"
persistent = true

[[rule]]
app = "^Finder$"
float = true

[[rule]]
app = "^Slack$"
workspace = "chat"

# Optional keybinds. These are the single source of truth for skhd and for a
# future built-in hotkey listener. key uses skhd syntax, command is the rovr
# CLI invocation without the leading "rovr".
# [[bind]]
# key = "alt - h"
# command = "window focus-direction west 1"
# [[bind]]
# key = "alt - l"
# command = "window focus-direction east 1"
# [[bind]]
# key = "alt - r"
# command = "layout rotate --space 1"

# Reload config and self-heal logical workspace/Space topology.
[[bind]]
key = "shift + alt - r"
command = "config reload"
