[workspace]
members = [
  "crates/rovr-types",
  "crates/rovr-core",
  "crates/rovr-layout",
  "crates/rovr-config",
  "crates/rovr-protocol",
  "crates/rovr-platform",
  "crates/rovr-daemon",
  "crates/rovr-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.78"
repository = "https://github.com/ekasc/rovr"

[workspace.dependencies]
anyhow = "1"
clap_complete = "4"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rovr-types = { path = "crates/rovr-types" }
rovr-core = { path = "crates/rovr-core" }
rovr-layout = { path = "crates/rovr-layout" }
rovr-config = { path = "crates/rovr-config" }
rovr-protocol = { path = "crates/rovr-protocol" }
rovr-platform = { path = "crates/rovr-platform" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
